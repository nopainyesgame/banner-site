<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NO PAIN YES GAME</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

.hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,
        rgba(0,0,0,.70),
        rgba(0,0,0,.15),
        rgba(0,0,0,.35));
}

.title{

    position:absolute;
    bottom:60px;
    width:100%;

    text-align:center;

    font-size:60px;
    font-weight:900;

    color:#ffffff;

    letter-spacing:8px;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00d9ff,
        0 0 40px #ff00ff,
        0 0 70px #ff00ff;

    animation:glow 2.5s ease-in-out infinite alternate;

}

@keyframes glow{

from{

opacity:.85;

transform:scale(1);

}

to{

opacity:1;

transform:scale(1.02);

}

}

</style>

</head>

<body>

<div class="hero">

<video autoplay muted loop playsinline>

<source src="banner.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<div class="title">
NO PAIN YES GAME
</div>

</div>

</body>

</html>
